<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Personal Interview | AI Interview Preparation Assistant</title>
<link rel="stylesheet" href="{{ url_for('static',filename='css/personal_interview.css') }}">
</head>
<body>
<div class="personal-page">
<div class="topbar">
<div class="brand">AI Interview Preparation Assistant</div>
<div class="round-info">PERSONAL INTERVIEW <span>04 / 06</span></div>
<div class="timer" id="timer">30:00</div>
</div>
<div class="main-content">
<div class="heading-area">
<div>
<div class="eyebrow">INTERVIEW PRACTICE</div>
<h1>Personal Interview</h1>
<p class="subtitle">Answer each question in your own words.</p>
</div>
<div class="question-count" id="questionCount">Question 1 of 25</div>
</div>
<div class="progress" id="progress"></div>
<div class="question-card">
<div class="question-number" id="questionNumber">QUESTION 01</div>
<h2 id="question"></h2>
<div class="answer-area">
<textarea id="answer" placeholder="Type your answer here..." spellcheck="false"></textarea>
<div class="answer-info">Write a clear and detailed answer.</div>
</div>
</div>
<div class="navigation">
<button type="button" class="nav-btn previous" id="previousBtn">Previous</button>
<button type="button" class="nav-btn next" id="nextBtn" disabled>Next</button>
<button type="button" class="nav-btn submit" id="submitBtn" disabled>Submit</button>
</div>
</div>
</div>
<script src="{{ url_for('static',filename='js/personal_interview.js') }}"></script>
</body>
</html>
