<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mock Interview | AI Interview Preparation Assistant</title>
<link rel="stylesheet" href="{{ url_for('static',filename='css/mock_interview.css') }}">
</head>
<body>
<div class="mock-page">
<div class="topbar">
<div class="brand">AI Interview Preparation Assistant</div>
<div class="round-info">MOCK INTERVIEW <span>06 / 06</span></div>
<div class="timer" id="timer">15:00</div>
</div>
<div class="main-content">
<div class="heading-area">
<div class="title-block">
<div class="eyebrow">INTERVIEW PRACTICE</div>
<h1>Mock Interview</h1>
<p class="subtitle">Complete the final interview simulation.</p>
</div>
<div class="question-count" id="questionCount">Question 1 of 10</div>
</div>
<div class="progress" id="progress"></div>
<div class="question-card">
<div class="question-number" id="questionNumber">QUESTION 01</div>
<div class="category">MOCK INTERVIEW</div>
<h2 id="question"></h2>
<div class="options" id="options"></div>
</div>
<div class="navigation">
<button type="button" class="nav-btn previous" id="previousBtn">Previous</button>
<button type="button" class="nav-btn next" id="nextBtn" disabled>Next</button>
<button type="button" class="nav-btn submit" id="submitBtn" disabled>Submit</button>
</div>
</div>
</div>
<script src="{{ url_for('static',filename='js/mock_interview.js') }}"></script>
</body>
</html>
