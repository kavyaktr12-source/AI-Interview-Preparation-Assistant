<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Coding Skill | AI Interview Preparation Assistant</title>
<link rel="stylesheet" href="{{ url_for('static',filename='css/coding_skill.css') }}">
</head>
<body>
<div class="coding-page">
<div class="topbar">
<div class="brand">AI Interview Preparation Assistant</div>
<div class="round-info">CODING SKILL <span>03 / 06</span></div>
<div class="timer" id="timer">30:00</div>
</div>
<div class="main-content">
<div class="heading-area">
<div class="title-block">
<div class="eyebrow">INTERVIEW PRACTICE</div>
<h1>Coding Skill</h1>
<p class="subtitle">Solve each programming problem using your preferred approach.</p>
</div>
<div class="question-count" id="questionCount">Question 1 of 5</div>
</div>
<div class="progress" id="progress"></div>
<div class="question-card">
<div class="question-number" id="questionNumber">QUESTION 01</div>
<h2 id="question"></h2>
<div class="code-area">
<textarea id="codeEditor" placeholder="Write your code here..." spellcheck="false"></textarea>
</div>
</div>
<div class="navigation">
<button type="button" class="nav-btn previous" id="previousBtn">Previous</button>
<button type="button" class="nav-btn next" id="nextBtn" disabled>Next</button>
<button type="button" class="nav-btn submit" id="submitBtn" disabled>Submit</button>
</div>
</div>
</div>
<script src="{{ url_for('static',filename='js/coding_skill.js') }}"></script>
</body>
</html>
